<!DOCTYPE html>

<html>

<head>

    <title>
        Physiotherapy Glove Login
    </title>

</head>


<body>


<h2>
    Physiotherapy Glove System
</h2>


<form action="/login" method="POST">


<label>
    Username:
</label>

<br>

<input 
type="text" 
name="username"
placeholder="Enter Username"
>


<br><br>


<label>
    Password:
</label>

<br>

<input 
type="password" 
name="password"
placeholder="Enter Password"
>


<br><br>


<input 
type="submit" 
value="Login"
>


</form>


</body>


</html>
